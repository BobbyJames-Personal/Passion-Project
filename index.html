<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="main.css">
</head>

<body>
<div style="display:none" id="endGameDiv">
    <h1 id="endGameText">AI is not worth detroying the world for. We shouldn't be dedicating resources to something that worsens peoples lives. Please think twice before using generative AI.</h1>
    <h1 id="endGameWinLose">You also like one by the way, congrats?</h1>
</div>
<div id="infoSection">
<div id="moneyDisplay">
    <h1>Moneys:</h1>
</div>
<div id="waterDisplay">
    
    <div id="waterDisplayBar" stlye="width:50%;">
        <h1>Water Left</h1>
    </div>
</div>

</div>
<div id="mainDiv">
    <div class="largeSection" id="promptSection">
    <h1>AI</h1>
    <div class="buySection" id="promptBuySection">
        <button id="advertise">Advertise<br><span class="smallText">$50 - $1/sec</span></button>
        <button id="improveCooling">Improve cooling<br><span class="smallText">$250 - $10/sec</span></button>
        <button id="buyServer">Buy server<br><span class="smallText">$1000 - $50/sec</span></button>
        <button id="buyRam">Buy ram<br><span class="smallText">$10000 - $100/sec</span></button>
    </div>
    <button id="promptButton">Prompt</button>
    </div>

    <div class="largeSection" id="waterSection">
        <h1>Water</h1>
        <div class="buySection" id="promptBuySection">
            <button id="drinkTheRain">Drink the rain<br><span class="smallText">$100 - 1 water/sec</span></button>
            <button id="boilPondWater">Boil pond water<br><span class="smallText">$500 - 10 water/sec</span></button>
            <button id="collectRain">Collect Rain<br><span class="smallText">$1500 - 50 water/sec</span></button>
            <button id="filterWaste">Filter waste<br><span class="smallText">$12500 - 100 water/sec</span></button>
        </div>
        <button id="waterButton">Water</button>
    </div>
</div>
    


<script src="main.js"></script>
</body>
</html>
